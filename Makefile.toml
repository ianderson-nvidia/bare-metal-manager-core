  "pre-commit-verify-workspace",
  "build-and-test-release-container-services",
]

[tasks.pre-commit-verify-workspace]
workspace = false
description = "Tasks that run on workspace level (not crate level) in pre-commit-verify"
category = "CI"
# The lint suite itself lives in the justfile, which sources its toolchains
# from the flake — including the pinned nightly that rustfmt and the
# carbide-lints rustc driver need. `just lint-ci` is the same set, in the same
# order, that the lint-police CI job runs.
# REST proto generation is covered by the dedicated check-rest-core-proto-sync CI job because it needs Go/buf setup.
dependencies = ["generate-rest-core-proto"]
script = '''
  just lint-ci
'''

