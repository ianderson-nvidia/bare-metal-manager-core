extend = [{ path = "Makefile-package.toml" }, { path = "Makefile-build.toml" }]

[config]
# CI installs this exact version in setup-mkosi-environment. Newer local
# versions remain allowed, but older versions fail before running tasks.
min_version = "0.37.24"

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
REPO_ROOT = { script = [
  "dirname $(cargo locate-project --message-format plain --workspace)",
] }
CARBIDE_ENVIRONMENT = { value = "local", condition = { env_not_set = [
  "CARBIDE_ENVIRONMENT",
] } }
FORGE_CA = { value = "nonprod", condition = { env_not_set = ["FORGE_CA"] } }
FORGE_CA_PATH = { value = "${REPO_ROOT}/dev/forge_${FORGE_CA}root.pem" }

BUILD_CONTAINER_X86_URL = { value = "urm.nvidia.com/swngc-ngcc-docker-local/forge/carbide/x86-64/build-container:latest", condition = { env_not_set = [
  "BUILD_CONTAINER_X86_URL",
] } }

BUILD_CONTAINER_AARCH64_URL = { value = "urm.nvidia.com/swngc-ngcc-docker-local/forge/carbide/arm64v8/build-container:latest", condition = { env_not_set = [
  "BUILD_CONTAINER_AARCH64_URL",
] } }

# Nightly is *ONLY* used for check-format-nightly, which enables a
# more-opinionated rustfmt that sorts imports for us. rust-toolchain.toml is
# respected for everything else.
#
# Make sure to update the RUST_NIGHTLY variable in
# dev/docker/Dockerfile.build-container-x86_64 if you change this.
RUST_NIGHTLY = "nightly-2026-06-16"

[tasks.book]
workspace = false
command = "find"
args = ["public"]
dependencies = ["book-compile"]

[tasks.gen-man]
category = "Build"
description = "Generate nico-admin-cli man pages into target/man"
workspace = false
script = '''
cargo run -p nico-admin-cli -- generate-man --out-dir target/man
'''

[tasks.gen-cli-docs]
category = "Build"
description = "Generate the nico-admin-cli markdown reference into docs/manuals/nico-admin-cli"
workspace = false
# `generate-cli-docs` renders each command's man page and converts it to
# markdown with pandoc, so the `pandoc` binary must be installed. It writes one
# directory per top-level command under docs/manuals/nico-admin-cli/commands
# plus the four domain index files (Hardware/Network/Tenant/Admin). The
# hand-authored pages (README.md, setup.md, workflows.md, rest-cli-parity.md)
# are left alone.
script = '''
cargo run -p nico-admin-cli -- generate-cli-docs --out-dir docs/manuals/nico-admin-cli
'''

[tasks.check-cli-docs]
category = "Test"
description = "Fail if docs/manuals/nico-admin-cli is stale or a command is missing a domain"
workspace = false
# Keeps the checked-in CLI reference honest as commands are added. First the
# domain-mapping test fails CI if a new command is not categorized in
# cli_domains.yaml; then we regenerate and fail if the result differs from
# what is committed (regenerate locally with `cargo make gen-cli-docs`).
script = '''
cargo test -p nico-admin-cli cfg::cli_options::tests
cargo run -p nico-admin-cli -- generate-cli-docs --out-dir docs/manuals/nico-admin-cli
git diff --exit-code -- docs/manuals/nico-admin-cli
'''

[tasks.build-cli]
category = "Build"
description = "Build nico-admin-cli locally using debian container. Ensures correct GCC version is used."
workspace = false
script = '''
docker run \
	--rm \
	--user $(id -u):$(id -g) \
	--volume $(pwd):/code \
	--workdir /code \
	--volume $CARGO_HOME:/cargo \
	--env CARGO_HOME=/cargo \
	"${BUILD_CONTAINER_X86_URL}" \
	cargo build -p nico-admin-cli --release
'''
dependencies = ["check-cargo-home-set"]
[tasks.check-cargo-home-set]
category = "Build"
description = "validates CARGO_HOME env var is set to something"
workspace = false
script = '''
# Check if CARGO_HOME is not set or is empty
if [ -z "$CARGO_HOME" ]; then
  # Set CARGO_HOME to $HOME/.cargo if it is not set
  CARGO_HOME="$HOME/.cargo"
fi
'''

[tasks.build-cargo-docker-image]
category = "Build"
description = "Build the Linux build container image for running Cargo via Docker (e.g. on macOS). Use with cargo-docker task."
workspace = false
script = '''
set -e
if [ -z "$CARGO_HOME" ]; then CARGO_HOME="$HOME/.cargo"; fi
docker build -f ${REPO_ROOT}/dev/docker/Dockerfile.build-container-x86_64 -t carbide-build-x86_64 ${REPO_ROOT}/dev/docker
echo "Image carbide-build-x86_64 built. Run: cargo make cargo-docker -- build -p nico-admin-cli --release"
'''

[tasks.build-cargo-docker-image-minimal]
category = "Build"
description = "Build minimal Cargo Docker image (Rust 1.97 + protoc). Quick (~2-5 min). Required once before cargo-docker-minimal for workspace builds (e.g. carbide-rpc)."
workspace = false
script = '''
set -e
docker build -f ${REPO_ROOT}/dev/docker/Dockerfile.cargo-docker-minimal -t carbide-build-minimal ${REPO_ROOT}/dev/docker
echo "Image carbide-build-minimal built. Run: cargo make cargo-docker-minimal -- build -p nico-admin-cli --release"
'''

[tasks.build-pxe-build-container]
category = "Build"
description = "Build the PXE artifact build container image (Ubuntu 24.04 + Rust 1.97 + mkosi deps). Required once before pxe-docker-x86."
workspace = false
script = '''
set -e
docker build -f ${REPO_ROOT}/dev/docker/Dockerfile.pxe-build-container -t carbide-pxe-builder ${REPO_ROOT}/dev/docker
echo "Image carbide-pxe-builder built. Run: cargo make pxe-docker-x86"
'''

[tasks.pxe-docker-x86]
category = "Build"
description = "Build x86_64 PXE boot artifacts inside a privileged container. Requires build-pxe-build-container first. Artifacts land in pxe/static/blobs/internal/x86_64/ via the repo mount."
workspace = false
script = '''
set -e
if [ -z "$CARGO_HOME" ]; then CARGO_HOME="$HOME/.cargo"; fi
SCCACHE_HOST="${SCCACHE_DIR:-$HOME/.sccache}"
mkdir -p "$SCCACHE_HOST"
HOST_UID=$(id -u)
HOST_GID=$(id -g)
if [ -n "$VERSION" ]; then
  PKG_VERSION=$(echo "$VERSION" | sed 's/^v//')
else
  PKG_VERSION=$(git -C "${REPO_ROOT}" describe --tags --first-parent --always --long 2>/dev/null | sed 's/^v//')
  case "${PKG_VERSION}" in
    [0-9]*) ;;
    *) PKG_VERSION="0.0.0-${PKG_VERSION}" ;;
  esac
fi
docker run --rm \
  --privileged \
  -v "${REPO_ROOT}":/code \
  -v "${CARGO_HOME}":/cargo \
  -v "${SCCACHE_HOST}":/sccache \
  -w /code \
  -e CARGO_HOME=/cargo \
  -e SCCACHE_DIR=/sccache \
  -e SA_ENABLEMENT=1 \
  -e PKG_VERSION="${PKG_VERSION}" \
  -e VERSION="${VERSION}" \
  -e HOST_UID="${HOST_UID}" \
  -e HOST_GID="${HOST_GID}" \
  carbide-pxe-builder \
  sh -c 'git config --global --add safe.directory /code && git config --global --add safe.directory /code/pxe/ipxe/upstream && r=0; cargo make --cwd pxe --env PKG_VERSION=${PKG_VERSION} --env SA_ENABLEMENT=1 build-boot-artifacts-x86-host-sa || r=$?; chown -R ${HOST_UID}:${HOST_GID} /code 2>/dev/null || true; exit $r'
'''
[tasks.cargo-docker]
category = "Build"
description = "Run Cargo inside the carbide-build-x86_64 Docker container. Requires build-cargo-docker-image first (slow on Apple Silicon). Pass cargo args after -- without extra quotes."
workspace = false
dependencies = ["check-cargo-home-set"]
script = '''
set -e
if [ -z "$CARGO_HOME" ]; then CARGO_HOME="$HOME/.cargo"; fi
CARGO_ARGS="${CARGO_MAKE_TASK_ARGS:-build -p nico-admin-cli --release}"
CARGO_ARGS="${CARGO_ARGS//;/ }"
CARGO_ARGS="${CARGO_ARGS#-- }"
docker run --rm \
  -v "${REPO_ROOT}":/code \
  -v "${CARGO_HOME}":/cargo \
  -w /code \
  -u $(id -u):$(id -g) \
  -e CARGO_HOME=/cargo \
  carbide-build-x86_64 \
  cargo ${CARGO_ARGS}
'''

[tasks.fix-target-permissions]
category = "Build"
description = "Fix ownership of target/ (and repo root if needed) so cargo-docker-minimal can write. Run once if you see 'Permission denied' writing to /code/target. Uses sudo."
workspace = false
script = '''
set -e
cd "${REPO_ROOT}"
if [ -d target ]; then
  sudo chown -R $(id -u):$(id -g) target
  echo "Fixed target/ ownership."
else
  sudo chown -R $(id -u):$(id -g) .
  echo "Fixed repo ownership (no target/ yet)."
fi
'''

[tasks.cargo-docker-minimal]
category = "Build"
description = "Run Cargo in minimal Linux image (Rust 1.97 + protoc). Requires build-cargo-docker-image-minimal once (~2-5 min). For DB tests set DATABASE_URL (use host.docker.internal, not localhost). Runs as root and chowns /code afterward so target/ stays writable on macOS/Colima."
workspace = false
dependencies = ["check-cargo-home-set"]
script = '''
set -e
if [ -z "$CARGO_HOME" ]; then CARGO_HOME="$HOME/.cargo"; fi
# cargo-make may join task args with semicolons; normalize to spaces and strip leading --
CARGO_ARGS="${CARGO_MAKE_TASK_ARGS:-build -p nico-admin-cli --release}"
CARGO_ARGS="${CARGO_ARGS//;/ }"
CARGO_ARGS="${CARGO_ARGS#-- }"
# Pass DATABASE_URL into container so DB tests can connect (use host.docker.internal from Mac)
DOCKER_EXTRA=
[ -n "$DATABASE_URL" ] && DOCKER_EXTRA="-e DATABASE_URL=$DATABASE_URL"
# Persistent sccache so repeat cargo test/build are much faster (optional: set SCCACHE_DIR on host)
SCCACHE_HOST="${SCCACHE_DIR:-$HOME/.sccache}"
mkdir -p "$SCCACHE_HOST"
# Allow container to reach host (e.g. Postgres); needed on Colima, harmless on Docker Desktop
# Run as root and chown /code afterward so target/ is always writable on the host (avoids
# recurring "Permission denied" with Colima/virtiofs UID mapping on macOS).
HOST_UID=$(id -u)
HOST_GID=$(id -g)
docker run --rm \
  --add-host=host.docker.internal:host-gateway \
  -v "${REPO_ROOT}":/code \
  -v "${CARGO_HOME}":/cargo \
  -v "${SCCACHE_HOST}":/sccache \
  -w /code \
  -e CARGO_HOME=/cargo \
  -e SCCACHE_DIR=/sccache \
  -e HOST_UID="${HOST_UID}" \
  -e HOST_GID="${HOST_GID}" \
  $DOCKER_EXTRA \
  carbide-build-minimal \
  sh -c 'r=0; cargo "$@" || r=$?; chown -R ${HOST_UID}:${HOST_GID} /code 2>/dev/null || true; exit $r' sh ${CARGO_ARGS}
'''

[tasks.test-docker-postgres-smoke]
category = "Build"
description = "Quick Postgres connectivity test via Docker (~10–30 s). Set DATABASE_URL (host.docker.internal). Use this instead of long carbide-api tests for a fast sanity check."
workspace = false
dependencies = ["check-cargo-home-set"]
script = '''
set -e
if [ -z "$CARGO_HOME" ]; then CARGO_HOME="$HOME/.cargo"; fi
DOCKER_EXTRA=
[ -n "$DATABASE_URL" ] && DOCKER_EXTRA="-e DATABASE_URL=$DATABASE_URL"
SCCACHE_HOST="${SCCACHE_DIR:-$HOME/.sccache}"
mkdir -p "$SCCACHE_HOST"
docker run --rm \
  --add-host=host.docker.internal:host-gateway \
  -v "${REPO_ROOT}":/code \
  -v "${CARGO_HOME}":/cargo \
  -v "${SCCACHE_HOST}":/sccache \
  -w /code \
  -u $(id -u):$(id -g) \
  -e CARGO_HOME=/cargo \
  -e SCCACHE_DIR=/sccache \
  $DOCKER_EXTRA \
  carbide-build-minimal \
  cargo test -p postgres-smoke-test
'''
